# GitHub Labels Configuration for Infin.Love
# Use with: https://github.com/crazy-max/ghaction-github-labeler

# Type Labels (what kind of work)
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working correctly"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "performance"
  color: "f9d0c4"
  description: "Performance improvements"

- name: "security"
  color: "b60205"
  description: "Security-related issues or improvements"

- name: "accessibility"
  color: "7e57c2"
  description: "Accessibility improvements (a11y)"

- name: "design"
  color: "e91e63"
  description: "Design and UI/UX improvements"

# Priority Labels
- name: "priority: critical"
  color: "b60205"
  description: "Critical priority - needs immediate attention"

- name: "priority: high"
  color: "d93f0b"
  description: "High priority"

- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority"

- name: "priority: low"
  color: "0e8a16"
  description: "Low priority"

# Status Labels
- name: "status: needs-triage"
  color: "ededed"
  description: "Needs initial review and categorization"

- name: "status: blocked"
  color: "d73a4a"
  description: "Blocked by another issue or external factor"

- name: "status: in-progress"
  color: "yellow"
  description: "Work has started"

- name: "status: needs-review"
  color: "0052cc"
  description: "Awaiting review"

- name: "status: changes-requested"
  color: "fbca04"
  description: "Changes requested in review"

- name: "status: approved"
  color: "0e8a16"
  description: "Approved and ready to merge"

# Effort Labels
- name: "effort: small"
  color: "c5def5"
  description: "Small effort (< 2 hours)"

- name: "effort: medium"
  color: "bfdadc"
  description: "Medium effort (2-8 hours)"

- name: "effort: large"
  color: "f9d0c4"
  description: "Large effort (1-3 days)"

- name: "effort: extra-large"
  color: "e99695"
  description: "Extra large effort (> 3 days)"

# Area Labels
- name: "area: ci/cd"
  color: "fef2c0"
  description: "CI/CD, GitHub Actions, automation"

- name: "area: tests"
  color: "d4c5f9"
  description: "Testing-related"

- name: "area: build"
  color: "fbca04"
  description: "Build process, dependencies"

- name: "area: content"
  color: "0e8a16"
  description: "Website content, copy, text"

- name: "area: mobile"
  color: "5319e7"
  description: "Mobile-specific issues"

- name: "area: pwa"
  color: "1d76db"
  description: "Progressive Web App features"

# Community Labels
- name: "good-first-issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help-wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "discussion"
  color: "cc317c"
  description: "Needs discussion or consensus"

# Sacred Values Labels
- name: "sacred-alignment"
  color: "ffd700"
  description: "Strongly aligned with sacred reciprocity values"

- name: "values-question"
  color: "ff9800"
  description: "Needs consideration of values alignment"

# Resolution Labels
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"

# Automated Labels
- name: "automated"
  color: "ededed"
  description: "Created by automation (Dependabot, etc.)"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "github-actions"
  color: "000000"
  description: "GitHub Actions related"

# Special Labels
- name: "breaking-change"
  color: "b60205"
  description: "Introduces breaking changes"

- name: "needs-decision"
  color: "fbca04"
  description: "Needs maintainer decision"

- name: "ready-to-ship"
  color: "0e8a16"
  description: "Ready for deployment/release"

# Browser-specific Labels
- name: "browser: chrome"
  color: "4285f4"
  description: "Chrome-specific issue"

- name: "browser: firefox"
  color: "ff7139"
  description: "Firefox-specific issue"

- name: "browser: safari"
  color: "006cff"
  description: "Safari-specific issue"

- name: "browser: edge"
  color: "0078d7"
  description: "Edge-specific issue"

# Device-specific Labels
- name: "device: mobile"
  color: "1d76db"
  description: "Mobile device issue"

- name: "device: tablet"
  color: "5319e7"
  description: "Tablet device issue"

- name: "device: desktop"
  color: "0052cc"
  description: "Desktop device issue"

# Notes:
# - Use labels sparingly but meaningfully
# - Combine labels for context (e.g., "bug" + "priority: high" + "area: mobile")
# - Review and update labels quarterly
# - Archive unused labels after 6 months
