name: Auto Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Label PR based on changed files
        uses: actions/labeler@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true

  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add size label
        uses: codelytv/pr-size-labeler@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size: xs'
          xs_max_size: '10'
          s_label: 'size: small'
          s_max_size: '100'
          m_label: 'size: medium'
          m_max_size: '500'
          l_label: 'size: large'
          l_max_size: '1000'
          xl_label: 'size: xl'
          fail_if_xl: 'false'
          message_if_xl: >
            This PR is very large! Consider breaking it into smaller, more focused PRs.
            Smaller PRs are easier to review and less likely to introduce bugs.
          files_to_ignore: |
            *.md
            *.txt
            .github/**
