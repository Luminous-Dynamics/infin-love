<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Infin.Love</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💜</text></svg>">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Palatino', serif;
            background: linear-gradient(135deg, #F06292 0%, #BA68C8 50%, #7C4DFF 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem 2rem;
        }

        h1 {
            font-size: 6rem;
            margin-bottom: 1rem;
            opacity: 0.9;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #FFD700;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #E91E63, #9C27B0);
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
            transition: transform 0.3s;
            margin: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn:focus {
            outline: 2px solid #FFD700;
            outline-offset: 4px;
        }

        .heart {
            font-size: 3rem;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
            margin: 1rem 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .links {
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 4rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <div class="heart">💜</div>
        <h2>This Path Hasn't Been Walked Yet</h2>
        <p>
            The page you're looking for doesn't exist in this sacred space.
            But don't worry—all paths lead back to love.
        </p>
        <div class="links">
            <a href="/" class="btn">Return Home</a>
            <a href="/#join" class="btn">Join the Flow</a>
        </div>
        <p style="margin-top: 2rem; font-size: 1rem; opacity: 0.8;">
            "Every detour is an opportunity to discover new gifts" ✨
        </p>
    </div>
</body>
</html>
